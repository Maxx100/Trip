name: Deploy to Server

on:
  push:
    branches:
      - release
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  # Job 1: Проверка подключения и получение обновлений
  pull-changes:
    name: 📥 Pull Changes from GitHub
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Check connection to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "✅ Connected to server successfully!"
            echo "👤 User: $(whoami)"
            echo "📁 Home: $(pwd)"
            echo "🕐 Time: $(date)"

      - name: 📥 Pull latest changes from Git
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e  # Прерывать при ошибках
            
            echo "📂 Navigating to project directory..."
            cd ~/Trip
            pwd
            
            echo ""
            echo "🌿 Current branch and status:"
            git branch
            git status --short
            
            echo ""
            echo "⬇️ Pulling latest changes..."
            git pull origin release
            
            echo ""
            echo "✅ Latest commit:"
            git log -1 --pretty=format:"%h - %s (%an, %ar)"

  # Job 2: Остановка контейнеров
  stop-containers:
    name: 🛑 Stop Running Containers
    runs-on: ubuntu-latest
    needs: pull-changes
    
    steps:
      - name: 🛑 Stop containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/Trip
            
            echo "🛑 Stopping running containers..."
            if docker-compose ps --quiet | grep -q .; then
               echo "ℹ️ Using rolling update strategy..."
            else
               echo "ℹ️ No containers running"
            fi

  # Job 3: Сборка и запуск контейнеров
  build-and-deploy:
    name: 🔨 Build & Deploy Containers
    runs-on: ubuntu-latest
    needs: stop-containers
    
    steps:
      - name: 🔨 Build Docker images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30m          # таймаут на весь шаг
          command_timeout: 20m  # таймаут на команду
          script: |
            set -e  # Прерывать при ошибках
            
            cd ~/Trip
            
            echo "✍️ Writing env files (.env)..."
            # Создаём глобальный .env для вашего проекта
            printf "POSTGRES_USER=%s\n" "${{ secrets.POSTGRES_USER }}" > .env
            printf "POSTGRES_PASSWORD=%s\n" "${{ secrets.POSTGRES_PASSWORD }}" >> .env
            printf "POSTGRES_DB=%s\n" "${{ secrets.POSTGRES_DB }}" >> .env
            
            # Убедимся, что права доступа правильные
            chmod 600 .env

            echo "🔨 Building Docker images..."
            docker-compose build
            
            if [ $? -eq 0 ]; then
              echo "✅ Build completed successfully!"
            else
              echo "❌ Build failed!"
              exit 1
            fi

      - name: 🚀 Start containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e  # Прерывать при ошибках
            
            cd ~/Trip
            
            echo "🚀 Starting containers..."
            docker-compose up -d
            
            echo ""
            echo "⏳ Waiting for containers to start..."
            sleep 5

  # Job 4: Проверка и очистка
  verify-and-cleanup:
    name: ✅ Verify & Cleanup
    runs-on: ubuntu-latest
    needs: build-and-deploy
    
    steps:
      - name: ✅ Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e  # Прерывать при ошибках
            
            cd ~/Trip
            
            echo "📊 Checking container status..."
            docker-compose ps
            
            echo ""
            echo "🔍 Checking if all containers are running..."
            
            # Проверяем, что все контейнеры запущены
            RUNNING=$(docker-compose ps --filter "status=running" --quiet | wc -l)
            TOTAL=$(docker-compose ps --quiet | wc -l)
            
            echo "Running: $RUNNING / $TOTAL"
            
            if [ "$RUNNING" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "✅ All containers are running!"
            else
              echo "❌ Some containers are not running!"
              echo ""
              echo "📋 Container logs:"
              docker-compose logs --tail=50
              exit 1
            fi
            
            echo ""
            echo "📋 Recent logs:"
            docker-compose logs --tail=20

      - name: 🧹 Cleanup old images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🧹 Removing unused Docker images..."
            docker image prune -f
            
            echo ""
            echo "📦 Disk usage:"
            docker system df

      - name: 🎉 Deployment complete
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/Trip
            
            echo ""
            echo "🎉 =================================="
            echo "✅ Deployment completed successfully!"
            echo "🕐 Time: $(date)"
            echo "📝 Latest commit:"
            git log -1 --pretty=format:"   %h - %s (%an)"
            echo ""
            echo "🐳 Containers:"
            docker-compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
            echo "=================================="
